name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @clock-in/shared build

      - name: Generate Prisma client
        run: pnpm --filter @clock-in/api prisma:generate

      - name: Typecheck monorepo
        run: pnpm typecheck && pnpm --filter @clock-in/api typecheck

      - name: Run unit & integration tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clock_in_test?schema=public
          JWT_ACCESS_SECRET: ci_test_access_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters_long
          CORS_ORIGIN: http://localhost:3000
        run: pnpm test

      - name: Build all applications
        run: pnpm build

      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

  docker-build:
    name: Verify Production Docker Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: clock-in-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: clock-in-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
