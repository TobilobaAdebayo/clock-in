services:
  postgres:
    image: postgres:16-alpine
    container_name: clock_in_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clock_in}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clock_in}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clock_in_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clock_in}?schema=public&connection_limit=20&pool_timeout=20
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_to_a_32_char_random_access_secret_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_to_a_32_char_random_refresh_secret_key}
      WORKSPACE_TIMEZONE: ${WORKSPACE_TIMEZONE:-Africa/Lagos}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-CLOCK IN Workspace}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:5000
    container_name: clock_in_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:5000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
